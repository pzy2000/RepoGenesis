[pytest]
# Pytest 配置文件

# 测试文件匹配模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试目录
testpaths = .

# 输出选项
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# 标记
markers =
    integration: 集成测试
    slow: 慢速测试（需要等待或长时间运行）

# 日志
log_cli = false
log_cli_level = INFO

